name: Build and Deploy to Cloudflare
on:
  push:
    branches: ["main"]
    paths-ignore:
      - docs/
      - .github/workflows/
  workflow_dispatch:
env:
  BUILD_DIR_NAME: dist
permissions:
  contents: read

jobs:
  builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - run: npm ci
      - name: Create a GitHub App token for branding
        id: brand-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: 5511128
          private-key: ${{ secrets.HOMELAB_APP_PRIVATE_KEY }}
          owner: aliAljaffer
          repositories: branding
      - name: Pull the theme from branding main
        run: npm run brand
        env:
          GH_TOKEN: ${{ steps.brand-token.outputs.token }}
      - run: npm run build -- --webpack
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build_files
          path: ${{env.BUILD_DIR_NAME}}

  deploy:
    needs: builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build_files
          path: ./dist

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # The zone settings were changed to stop caching HTML (cache_level basic,
      # browser TTL respecting origin). This purge clears anything cached under
      # the old policy.
      - name: Purge the edge cache
        continue-on-error: true
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://alialjaffer.com/","https://www.alialjaffer.com/"]}'
